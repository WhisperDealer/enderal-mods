    <font face='$HandwrittenFont'><font size='16'>

    Beloved Sira,

    I have not written to you since the funeral. I could not. But tonight I have found a purpose again, and you should be the first to hear it, even if you never will.

    You always said that people are good at heart, and that they only need to be shown the way. For twenty years I believed it with you. We showed them the way, again and again - the lessons, the sermons in the Undercity, the Food Bank. And they answered with a knife.

    So I have asked myself the one question the Order forbids: What if showing them is not enough? A decree can be revoked. Bread can be stolen. A sermon is forgotten before the bell has finished ringing. But a mind that has been changed stays changed.

    Light Magic mends what is broken in the body. Why should it not mend what is broken in the will? Every night since we buried you, I have come down here, beneath the Temple, and bent the Light towards that end. It does not want to bend. It resists like a living thing, and when it gives way, what comes out of it is no longer Light. The Holy Order would call it Psionics, and they would burn me for it. Perhaps they would be right to. I call it the only cure left.

    The first workings are crude. With one, I whisper a thought into a man's head, and he believes it was his own. With another, I can make him lay down his weapon, or leave, or kneel. When the will of a man cannot be bent at all, I can cast him out of my sight entirely - and if I must, I can make the Light stand guard at my side.

    Yesterday I tried it on the baker at the Temple gate, the one who chases the Undercity children away with a broom. For one hour, he gave his bread to the beggars, and he smiled while he did it.

    One hour. It is not enough. Not yet.

    I know what you would say: That goodness which is forced is no goodness at all. But you are not here to say it, are you? They saw to that.

    My head aches when I work too long, and of late my dreams are all red. It does not matter. Malphas did not change this world, and neither did we. But perhaps I still can - one mind at a time.
