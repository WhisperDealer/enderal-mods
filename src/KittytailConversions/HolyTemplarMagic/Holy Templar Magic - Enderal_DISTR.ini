; Holy Templar Magic - Enderal conversion. Requires Spell Perk Item Distributor (SPID).
;
; Kittytail's own Lightpower_DISTR.ini targets the Vigilants of Stendarr (0xB3292), Florentius,
; Gelebor and the Dawnguard - none of which exist in Enderal, so it distributes nothing here and
; can stay installed harmlessly. This file gives the same spells to the nearest Enderal equivalent:
; the Holy Order's Sun Temple guards, SuntempleGuardFaction 0F76C0:Skyrim.esm (13 NPCs, levels
; 25-30: _25E_TempleGuard01, _30E_SuntempleGuard01-08, ...).
;
; The NPC versions of Hallowed Flare do not damage SuntempleFaction or SuntempleGuardFaction
; members - the patch repoints Kittytail's friendly-fire conditions onto those two factions.

; AI use Hallowed Flare scripted ability
Spell = 0x854~Lightpower.esl|NONE|0xF76C0~Skyrim.esm|25|NONE|NONE|50

; Sun Shards
Spell = 0x824~Lightpower.esl|NONE|0xF76C0~Skyrim.esm|10|NONE|NONE|50
